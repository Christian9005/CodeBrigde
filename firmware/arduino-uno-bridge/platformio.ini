; CodeBridge sketch for AVR Arduino boards: one environment per board.

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

[env:uno]
board = uno
upload_speed = 115200

[env:nano]
board = nanoatmega328new
upload_speed = 115200

[env:mega]
board = megaatmega2560
upload_speed = 115200
